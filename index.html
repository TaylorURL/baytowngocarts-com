    <script>
      (function () {
        var endpoint = "https://sunday.tail1f78d7.ts.net/report";
        var site = "Baytown Go Karts";
        var sent = 0;
        // Nothing the page can intercept reaches the visitor's console. Each
        // error is reported first and swallowed second, so the report is made
        // whether or not the suppression holds. What survives is written by the
        // browser's own network layer, which no page script can reach.
        var loud = false;
        var held = [];
        try {
          if (location.search.indexOf("console=on") > -1)
            localStorage.setItem("reporter-console", "1");
          if (location.search.indexOf("console=off") > -1)
            localStorage.removeItem("reporter-console");
          loud = localStorage.getItem("reporter-console") === "1";
        } catch (ignored) {}
        // React 18 recovers from hydration errors #418, #421, #422, #423 and
        // #425 on its own: the mismatch is caught, the prerendered tree is
        // discarded and the page draws itself again client-side, so the
        // visitor never sees a break. The ones that still reach this reporter
        // are the ones a user-agent regex cannot pick out - the tab was
        // rewritten between prerender-serve and hydration by something outside
        // the app. Chrome's built-in Translate is the common one, and a
        // Chrome Custom Tabs host running evaluateJavascript into the tab, a
        // cellular carrier or ISP injecting HTML on the wire, and an on-device
        // antivirus or parental-control proxy do the same. Opening a ticket
        // every time chrome://translate does its job would drown the real
        // defects in noise from things this site does not own.
        var recoveredReact = /Minified React error #(?:418|421|422|423|425)\b/;

        // inside one arrives at this handler with nothing of the site in its
        // stack. A stack naming only extension scripts describes the visitor's
        // browser; one carrying a single site frame is the site's.
        //
        // DuckDuckGo's iOS browser injects its Content Scope Scripts runtime
        // under a user-script: URL scheme rather than an extension one, and it
        // logs its own setup failures through console.error, which arrives here
        // with the stack embedded in the message string and nothing in the stack
        // argument. Reading both, and treating a user-script frame as a browser
        // frame, keeps that log out of the queue.
        function browserOnly(text) {
          var schemes = String(text || "").match(/[a-z][a-z0-9+.-]*:\/\//gi);
          if (!schemes) return false;
          for (var i = 0; i < schemes.length; i += 1) {
            var scheme = schemes[i].slice(0, -3).toLowerCase();
            if (scheme.slice(-9) === "extension") continue;
            if (scheme === "user-script") continue;
            return false;
          }
          return true;
        }
        // A crawler's rendered visit runs the page in a headless environment
        // that cancels its own outgoing requests on its own schedule, so the
        // dynamic module import for the app bundle drops as "Importing a
        // module script failed" and a Supabase fetch drops as a network error
        // - one ticket per crawl, for a page no reader would have seen. The
        // list mirrors the one useTraffic uses to skip crawler page views, so
        // both the traffic record and the report are quiet on the same visits.
        var CRAWLER_UA =
          /bot\b|crawler|spider|slurp|bingpreview|facebookexternalhit|whatsapp|telegrambot|discordbot|linkedinbot|petalbot|semrushbot|ahrefsbot|mj12bot|baiduspider|applebot|yandex|duckduckbot|chatgpt|perplexity|claudebot|gptbot|amazonbot|meta-externalagent/i;
        function isCrawler() {
          try {
            return CRAWLER_UA.test(navigator.userAgent || "");
          } catch (ignored) {
            return false;
          }
        }
        // A request the page makes writes its own failure to the console when it
        // fails, and a collector that cannot be reached would then be the loudest
        // thing on the page. The same request issued inside a worker writes
        // nothing, so reports travel that way while the page is alive.
        var unloading = false;
        var worker = null;
        var workerFailed = false;
        function transport() {
          if (worker || workerFailed) return worker;
          try {
            var source =
              "self.onmessage=function(e){fetch(e.data.endpoint,{method:'POST',body:e.data.body}).then(function(){},function(){})}";
            worker = new Worker(
              URL.createObjectURL(
                new Blob([source], { type: "text/javascript" }),
              ),
            );
          } catch (ignored) {
            workerFailed = true;
          }
          return worker;
        }
        function send(body) {
          // On the way out the worker dies with the page, and the console goes
          // with it, so the beacon's survival is worth more than its silence.
          if (!unloading) {
            var channel = transport();
            if (channel) {
              channel.postMessage({ endpoint: endpoint, body: body });
              return;
            }
          }
          if (navigator.sendBeacon) {
            navigator.sendBeacon(endpoint, body);
          } else {
            fetch(endpoint, {
              method: "POST",
              body: body,
              keepalive: true,
            }).catch(function () {});
          }
        }
        window.addEventListener("pagehide", function () {
          unloading = true;
        });
        // Everything swallowed stays readable on the page itself, so a live
        // console with the flag off still answers what happened.
        function hold(kind, message, stack) {
          if (held.length < 50)
            held.push({
              kind: kind,
              message: String(message),
              stack: String(stack || ""),
            });
        }
        window.__reporter = {
          held: held,
          replay: function () {
            return held.slice();
          },
        };
        function report(kind, message, stack) {
          hold(kind, message, stack);
          if (sent >= 10) return; // a page stuck in an error loop stops at ten
          if (isCrawler()) return;
          if (recoveredReact.test(String(message || ""))) return;
          if (recoveredReact.test(String(stack || ""))) return;
          if (browserOnly(stack) || browserOnly(message)) return;
          sent += 1;
          try {
            send(
              JSON.stringify({
                site: site,
                kind: kind,
                message: String(message || "Unknown error").slice(0, 1500),
                stack: String(stack || "").slice(0, 4000),
                url: location.href,
                userAgent: navigator.userAgent,
              }),
            );
          } catch (ignored) {}
        }
        // A hashed build file that 404s is nearly always a document the host
        // has moved past: the route loader asks for a chunk from the build the
        // tab still holds, and it reloads onto the current one. That failure is
        // the recovery working, so a report for one waits to see whether the
        // recovery happens. A build that is missing a file for any other
        // reason leaves the page where it is, and the wait ends with the
        // report going out.
        var heldAssets = [];
        var HOLD_MS = 5000;
        function buildAsset(url) {
          return (
            typeof url === "string" &&
            url.indexOf(location.origin + "/assets/") === 0
          );
        }
        function flushHeldAssets() {
          while (heldAssets.length) {
            report("resource", heldAssets.shift());
          }
        }
        function holdAsset(message) {
          heldAssets.push(message);
          setTimeout(flushHeldAssets, HOLD_MS);
        }
        window.addEventListener("speedway146:build-refresh", function () {
          heldAssets.length = 0;
        });
        // Leaving for any other reason ends the wait, so a page closed on a
        // real failure still reports it.
        window.addEventListener("pagehide", flushHeldAssets);
        function servedHere(url) {
          if (typeof url !== "string") return false;
          // A stack frame carries the position appended to the URL, so the
          // trailing line and column come off before the path is read.
          var path = url.replace(/:\d+:\d+$/, "");
          return (
            path.indexOf(location.origin + "/") === 0 &&
            /\.[cm]?jsx?(?:[?#]|$)/.test(path)
          );
        }
        // An in-app browser evaluates its own script inside the page, and the
        // engine attributes those frames to the document URL instead of to a
        // file, which makes a failure in one read as a failure of the page. An
        // error is this site's only when a file this site serves appears in it.
        // One carrying no location at all is still reported: the page is the
        // likelier source, and dropping those would lose real failures.
        function attributable(filename, stack) {
          var frames = String(stack || "").match(/https?:\/\/[^\s)'"]+/g) || [];
          if (filename) frames.push(filename);
          if (!frames.length) return true;
          for (var i = 0; i < frames.length; i += 1) {
            if (servedHere(frames[i])) return true;
          }
          return false;
        }
        function flatten(args, from) {
          var parts = [];
          for (var i = from; i < args.length; i += 1) {
            var piece = args[i];
            if (piece && piece.stack) {
              parts.push(piece.stack);
            } else if (typeof piece === "object") {
              try {
                parts.push(JSON.stringify(piece));
              } catch (ignored) {
                parts.push(String(piece));
              }
            } else {
              parts.push(String(piece));
            }
          }
          return parts.join(" ");
        }
        // Capture phase, because element load failures fire error events that do not bubble.
        window.addEventListener(
          "error",
          function (event) {
            try {
              if (
                event.target &&
                event.target !== window &&
                event.target.tagName
              ) {
                var source = event.target.src || event.target.href || "";
                // A preload is a hint the browser is allowed to drop, and iOS
                // Safari drops the ones for images with imagesrcset when the
                // candidate it would pick is not the href attribute. The picture
                // still renders through the img element that follows, which
                // fires its own error event if that fetch fails, so a preload
                // failure carries no independent signal about what the visitor
                // saw.
                var rel = (event.target.rel || "").toLowerCase();
                if (
                  event.target.tagName.toLowerCase() === "link" &&
                  (rel === "preload" ||
                    rel === "modulepreload" ||
                    rel === "prefetch")
                ) {
                  return;
                }
                var failure =
                  "Failed to load " +
                  event.target.tagName.toLowerCase() +
                  ": " +
                  source;
                if (buildAsset(source)) {
                  holdAsset(failure);
                } else {
                  report("resource", failure);
                }
              } else {
                var stack = event.error && event.error.stack;
                if (!attributable(event.filename, stack)) return;
                report("uncaught", event.message, stack);
              }
            } finally {
              if (!loud) event.preventDefault();
            }
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (event) {
          try {
            var reason = event.reason;
            var stack = reason && reason.stack;
            if (stack && !attributable("", stack)) return;
            report(
              "rejection",
              reason && reason.message ? reason.message : reason,
              stack,
            );
          } finally {
            if (!loud) event.preventDefault();
          }
        });
        // A library writing to these is addressing whoever maintains the site
        // rather than whoever is reading the page, so the message travels to the
        // Pi instead of to the visitor's console.
        ["error", "warn", "trace"].forEach(function (level) {
          var original = console[level];
          console[level] = function () {
            report("console", flatten(arguments, 0));
            if (loud) original.apply(console, arguments);
          };
        });
        var originalAssert = console.assert;
        console.assert = function (condition) {
          if (condition) return;
          report("console", "Assertion failed: " + flatten(arguments, 1));
          if (loud) originalAssert.apply(console, arguments);
        };
        // A third-party fetch that fails or answers 5xx is not this site's to
        // fix: a privacy extension or tracking-protection ruleset blocking a
        // request outside our origin is the common cause, and the caller that
        // asked for it already decides what a failure means (the geo lookup
        // resolves to null and the page view is written without it). Reporting
        // one anyway files a ticket that reads like an outage from something a
        // visitor never noticed. The wrapper's reports stay on requests whose
        // host we serve - same origin and the Supabase backend behind it.
        function firstParty(url) {
          if (typeof url !== "string" || !url) return false;
          if (url.charAt(0) === "/" && url.charAt(1) !== "/") return true;
          if (
            url === location.origin ||
            url.indexOf(location.origin + "/") === 0
          )
            return true;
          var match = url.match(/^https?:\/\/([^/]+)/);
          if (!match) return false;
          return /\.supabase\.(?:co|in)$/i.test(match[1]);
        }
        if (window.fetch) {
          var originalFetch = window.fetch;
          window.fetch = function (input, init) {
            var target =
              typeof input === "string" ? input : (input && input.url) || "";
            // Reports about the reporter's own request would loop, so the endpoint passes through unwrapped.
            if (target.indexOf(endpoint) === 0)
              return originalFetch.apply(window, arguments);
            // A caller that sets keepalive has already told the browser this
            // request is allowed to outlive its page - and that the browser is
            // allowed to drop it if the way out is too crowded to carry it.
            // The pagehide traffic write is the caller here, and iOS Safari on
            // a mobile network tears those down at its own schedule, so a
            // network failure describes the exit rather than a defect on the
            // site. The caller reads the outcome for itself and files nothing.
            var keepalive = false;
            try {
              if (init && init.keepalive) keepalive = true;
              else if (input && typeof input === "object" && input.keepalive)
                keepalive = true;
            } catch (ignored) {}
            return originalFetch.apply(window, arguments).then(
              function (response) {
                if (response.status >= 500 && firstParty(target))
                  report(
                    "http",
                    "HTTP " + response.status + " from " + target.split("?")[0],
                  );
                return response;
              },
              function (error) {
                if (!keepalive && firstParty(target)) {
                  report(
                    "network",
                    (error && error.message ? error.message : String(error)) +
                      " fetching " +
                      target.split("?")[0],
                  );
                }
                throw error;
              },
            );
          };
        }
      })();
    </script>
