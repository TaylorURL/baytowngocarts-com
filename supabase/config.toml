project_id = "ggkqadmnvrjsewnazdxj"

[functions.create-checkout]
verify_jwt = true

# Stripe signs its posts with the webhook secret and sends no Supabase token,
# so the gateway has to let the request through for the function to check the
# signature itself.
[functions.stripe-webhook]
verify_jwt = false

# pg_cron posts with x-sweep-secret rather than a user's token, and the
# function checks that secret itself.
[functions.email-sweep]
verify_jwt = false

# A mail client's one-click unsubscribe posts with no Supabase token at all.
# The unsubscribe token in the link is the credential.
[functions.email-unsubscribe]
verify_jwt = false
